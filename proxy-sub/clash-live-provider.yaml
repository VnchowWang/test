mixed-port: 7890
external-controller: 127.0.0.1:9090
allow-lan: false
mode: rule
log-level: warning
ipv6: false
unified-delay: true
tcp-concurrent: true
find-process-mode: 'off'
geodata-mode: false
geo-auto-update: false
profile:
  store-selected: true
  store-fake-ip: true
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
    - 223.5.5.5
  fallback:
    - https://1.1.1.1/dns-query
    - https://dns.google/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4
proxy-providers:
  live:
    type: http
    url: https://raw.githubusercontent.com/VnchowWang/test/main/proxy-sub/live-provider.yaml
    interval: 300
    path: ./live-provider.yaml
    exclude-filter: (?i)过期|剩余|流量|官网|到期|重置|套餐|群组|防失联|失联|距离下次|Expire|Traffic|Website
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 10
      lazy: false
      max-failed-times: 3
proxy-groups:
  - name: ⭐ 智能选择
    type: fallback
    use:
      - live
    url: http://www.gstatic.com/generate_204
    interval: 30
    lazy: false
    max-failed-times: 3
  - name: 🔥 最快节点
    type: url-test
    use:
      - live
    url: http://www.gstatic.com/generate_204
    interval: 10
    lazy: false
    tolerance: 50
    max-failed-times: 3
  - name: 🇭🇰 香港
    type: fallback
    use:
      - live
    filter: 🇭🇰|香港|HK|hk_
    url: http://www.gstatic.com/generate_204
    interval: 30
    lazy: false
    max-failed-times: 3
  - name: 🇹🇼 台湾
    type: fallback
    use:
      - live
    filter: 🇹🇼|台湾|臺灣|TW|tw_
    url: http://www.gstatic.com/generate_204
    interval: 30
    lazy: false
    max-failed-times: 3
  - name: 🇯🇵 日本
    type: fallback
    use:
      - live
    filter: 🇯🇵|日本|JP|JP_|Japan
    url: http://www.gstatic.com/generate_204
    interval: 30
    lazy: false
    max-failed-times: 3
  - name: 🇸🇬 新加坡
    type: fallback
    use:
      - live
    filter: 🇸🇬|新加坡|SG|SG_
    url: http://www.gstatic.com/generate_204
    interval: 30
    lazy: false
    max-failed-times: 3
  - name: 🤖 AI 服务
    type: select
    proxies:
      - 🇭🇰 香港
      - 🇹🇼 台湾
      - 🇯🇵 日本
      - 🇸🇬 新加坡
  - name: 🎬 Netflix
    type: select
    proxies:
      - 🇭🇰 香港
      - 🇹🇼 台湾
      - 🇯🇵 日本
      - 🇸🇬 新加坡
  - name: 📺 动画疯
    type: select
    proxies:
      - 🇹🇼 台湾
  - name: 🛒 Google Play
    type: select
    proxies:
      - 🇭🇰 香港
      - 🇹🇼 台湾
      - 🇯🇵 日本
      - 🇸🇬 新加坡
  - name: 🔀 手动切换
    type: select
    use:
      - live
    proxies:
      - ⭐ 智能选择
      - 🔥 最快节点
      - 🇭🇰 香港
      - 🇹🇼 台湾
      - 🇯🇵 日本
      - 🇸🇬 新加坡
      - 🤖 AI 服务
      - 🎬 Netflix
      - 📺 动画疯
      - 🛒 Google Play
      - DIRECT
  - name: 🎯 直连
    type: select
    proxies:
      - DIRECT
      - ⭐ 智能选择
  - name: 🛑 拦截
    type: select
    proxies:
      - REJECT
      - DIRECT
