name: Update selected 9929 subscription

on:
  schedule:
    # UTC: every 30 minutes, at minutes 17 and 47.
    - cron: '17,47 * * * *'
  workflow_dispatch:

# The repository is read-only; only the separate GIST_TOKEN can update the secret gist.
permissions:
  contents: read

concurrency:
  group: selected-9929-subscription
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out reviewed public code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned dependency
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run isolated tests without source secrets
        run: python -m unittest discover -s tests -v
      - name: Fetch exact selections and update secret gist
        env:
          SOURCE_ZHANGZHONG: ${{ secrets.SOURCE_ZHANGZHONG }}
          SOURCE_SPEEDY: ${{ secrets.SOURCE_SPEEDY }}
          SOURCE_MUACLOUD: ${{ secrets.SOURCE_MUACLOUD }}
          SOURCE_XINGHE: ${{ secrets.SOURCE_XINGHE }}
          SOURCE_AOYO: ${{ secrets.SOURCE_AOYO }}
          SOURCE_ZHUIYUN_VIP3: ${{ secrets.SOURCE_ZHUIYUN_VIP3 }}
          SOURCE_ZHUIYUN_VIP2: ${{ secrets.SOURCE_ZHUIYUN_VIP2 }}
          SOURCE_STARDREAM: ${{ secrets.SOURCE_STARDREAM }}
          SOURCE_SESE: ${{ secrets.SOURCE_SESE }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: python subscription_bundle.py publish
      - name: Save credential-free update report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: subscription-update-status
          path: .private/update-status.json
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: true
